population:
  size: 200
  genome_len: 32

simulation:
  n_periods: 100
  death_threshold: 0.2
  fitness_fn: "quadratic"       # quadratic | plateau | rugged

operators:
  mutation_rate: 0.01
  crossover_rate: 0.7
  cognitive_bonus: 0.15         # bonus fitness pour innovation cognitive

visualization:
  axes:
    x: trait_x
    y: trait_y
    z: fitness
  export: mp4                   # mp4 | gif
